<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalkulyator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #ffffff;
    --bg-2: #f0f2f5;
    --text: #000000;
    --text-2: #707579;
    --primary: #3390ec;
    --border: #e4e6eb;
    --msg-out: #effdde;
    --msg-in: #ffffff;
    --danger: #e53935;
}

body.dark {
    --bg: #17212b;
    --bg-2: #232e3c;
    --text: #ffffff;
    --text-2: #7d8b99;
    --primary: #5288c1;
    --border: #101921;
    --msg-out: #2b5278;
    --msg-in: #182533;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
}

/* ==================== KALKULYATOR ==================== */
#calc-view {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
    background: var(--bg);
}

#calc-display {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 20px;
    font-size: 48px;
    font-weight: 300;
    word-break: break-all;
    text-align: right;
    overflow-y: auto;
}

#calc-display .ifoda {
    font-size: 24px;
    color: var(--text-2);
    margin-bottom: 10px;
}

#calc-display .natija {
    font-size: 48px;
    color: var(--text);
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 0;
}

.calc-btn {
    padding: 20px;
    font-size: 24px;
    border: none;
    border-radius: 12px;
    background: var(--bg-2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.1s;
    user-select: none;
}

.calc-btn:active {
    transform: scale(0.95);
    background: var(--border);
}

.calc-btn.op {
    background: var(--primary);
    color: white;
}

.calc-btn.eq {
    background: var(--primary);
    color: white;
    grid-column: span 2;
}

.calc-btn.clr {
    background: var(--danger);
    color: white;
}

/* ==================== PAROL MODAL ==================== */
#verify-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

#verify-modal.active {
    display: flex;
}

.verify-box {
    background: var(--bg);
    padding: 24px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.verify-box h3 {
    margin-bottom: 16px;
    text-align: center;
    font-size: 20px;
}

.verify-box .misol {
    font-size: 32px;
    text-align: center;
    margin: 20px 0;
    color: var(--primary);
    font-weight: bold;
}

.verify-box input {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
    color: var(--text);
    margin-bottom: 12px;
    outline: none;
}

.verify-box input:focus {
    border-color: var(--primary);
}

.verify-box button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.verify-box button.cancel {
    background: var(--bg-2);
    color: var(--text);
    margin-top: 8px;
}

/* ==================== ASOSIY APP ==================== */
#app-view {
    display: none;
    flex-direction: column;
    height: 100vh;
}

#app-view.active {
    display: flex;
}

.app-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    gap: 12px;
}

.app-header .name {
    flex: 1;
    font-weight: 600;
    font-size: 18px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-btn:active {
    background: var(--border);
}

.app-content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 70px;
}

.tab-content {
    display: none;
    padding: 8px;
}

.tab-content.active {
    display: block;
}

/* Chat list */
.chat-item {
    display: flex;
    align-items: center;
    padding: 12px;
    gap: 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
}

.chat-item:active {
    background: var(--bg-2);
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-info .name {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-info .last {
    color: var(--text-2);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-info .last.unread {
    color: var(--primary);
    font-weight: 600;
}

/* Chat window */
#chat-window {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    z-index: 100;
}

#chat-window.active {
    display: flex;
}

.chat-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    gap: 8px;
}

.chat-header-info {
    flex: 1;
    min-width: 0;
}

.chat-header-info .name {
    font-weight: 600;
    font-size: 15px;
}

.chat-header-info .status {
    font-size: 12px;
    color: var(--text-2);
}

.chat-header-info .status.online {
    color: #4caf50;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.message {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 16px;
    font-size: 15px;
    word-wrap: break-word;
    line-height: 1.35;
    position: relative;
    animation: msgIn 0.2s;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.out {
    align-self: flex-end;
    background: var(--msg-out);
    border-bottom-right-radius: 4px;
}

.message.in {
    align-self: flex-start;
    background: var(--msg-in);
    border-bottom-left-radius: 4px;
}

.message .vaqt {
    font-size: 10px;
    color: var(--text-2);
    margin-left: 8px;
    float: right;
    margin-top: 4px;
}

.message .tahrirlangan {
    font-size: 10px;
    color: var(--text-2);
    margin-left: 4px;
}

.message img {
    max-width: 100%;
    border-radius: 10px;
    margin-bottom: 4px;
}

.typing {
    font-size: 13px;
    color: var(--primary);
    padding: 4px 12px;
    font-style: italic;
}

.chat-input {
    display: flex;
    align-items: center;
    padding: 8px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    gap: 8px;
}

.chat-input input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 24px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
}

.send-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
}

/* Pastki menu */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 50;
}

.nav-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
}

.nav-btn .icon {
    font-size: 22px;
}

.nav-btn.active {
    color: var(--primary);
}

/* Rasmlar grid */
.photos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
}

.photo-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-2);
    cursor: pointer;
}

.photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-item .delete {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
}

/* Profil */
.profile-section {
    padding: 20px;
    text-align: center;
}

.profile-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 600;
    margin-bottom: 16px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
}

.profile-username {
    color: var(--text-2);
    margin-bottom: 20px;
}

.profile-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--bg-2);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
}

.profile-row:active {
    opacity: 0.7;
}

.profile-row .label {
    color: var(--text-2);
}

.profile-row .value {
    font-weight: 500;
}

/* Qidiruv modal */
#search-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 200;
    padding: 20px;
    padding-top: 80px;
}

#search-modal.active {
    display: block;
}

.search-box {
    background: var(--bg);
    padding: 16px;
    border-radius: 16px;
    max-width: 500px;
    margin: 0 auto;
}

.search-box input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
}

.search-result {
    padding: 12px;
    background: var(--bg-2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

/* Toast */
#toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 9999;
    max-width: 90%;
    text-align: center;
}

#toast.show {
    opacity: 1;
}

/* ==================== 2-TAP DETEKTOR ==================== */
.tap-hint {
    position: fixed;
    bottom: 70px;
    right: 20px;
    background: var(--primary);
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    opacity: 0.7;
    pointer-events: none;
    z-index: 10;
}
</style>
</head>
<body>

<!-- ==================== KALKULYATOR ==================== -->
<div id="calc-view">
    <div id="calc-display">
        <div class="ifoda" id="calc-ifoda"></div>
        <div class="natija" id="calc-natija">0</div>
    </div>
    <div class="calc-grid">
        <button class="calc-btn clr" onclick="calcClear()">C</button>
        <button class="calc-btn clr" onclick="calcBack()">⌫</button>
        <button class="calc-btn op" onclick="calcOp('%')">%</button>
        <button class="calc-btn op" onclick="calcOp('/')">÷</button>
        
        <button class="calc-btn" onclick="calcNum('7')">7</button>
        <button class="calc-btn" onclick="calcNum('8')">8</button>
        <button class="calc-btn" onclick="calcNum('9')">9</button>
        <button class="calc-btn op" onclick="calcOp('*')">×</button>
        
        <button class="calc-btn" onclick="calcNum('4')">4</button>
        <button class="calc-btn" onclick="calcNum('5')">5</button>
        <button class="calc-btn" onclick="calcNum('6')">6</button>
        <button class="calc-btn op" onclick="calcOp('-')">−</button>
        
        <button class="calc-btn" onclick="calcNum('1')">1</button>
        <button class="calc-btn" onclick="calcNum('2')">2</button>
        <button class="calc-btn" onclick="calcNum('3')">3</button>
        <button class="calc-btn op" onclick="calcOp('+')">+</button>
        
        <button class="calc-btn" onclick="calcNum('0')">0</button>
        <button class="calc-btn" onclick="calcNum('.')">.</button>
        <button class="calc-btn eq" onclick="calcEqual()">=</button>
    </div>
</div>

<!-- ==================== PAROL MODAL ==================== -->
<div id="verify-modal">
    <div class="verify-box">
        <h3>🔐 Tasdiqlash</h3>
        <div class="misol" id="verify-misol">14+12 = ?</div>
        <input type="text" id="verify-input" placeholder="javob.parol" autocomplete="off">
        <button onclick="verifySubmit()">Kirish</button>
        <button class="cancel" onclick="verifyCancel()">Bekor qilish</button>
    </div>
</div>

<!-- ==================== ASOSIY APP ==================== -->
<div id="app-view">
    <header class="app-header">
        <div class="avatar" id="header-avatar" onclick="switchTab('profile')">U</div>
        <div class="name" id="header-name">Foydalanuvchi</div>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
        <button class="icon-btn" onclick="openSearch()">🔍</button>
    </header>
    
    <div class="app-content">
        <!-- CHATLAR -->
        <div class="tab-content active" id="tab-chats">
            <div id="chat-list"></div>
            <div id="empty-chats" style="text-align:center; padding:60px 20px; color:var(--text-2); display:none;">
                <div style="font-size:48px;">💬</div>
                <div style="margin-top:12px;">Chatlar yo'q</div>
                <div style="font-size:13px; margin-top:8px;">🔍 tugmasi orqali odam qidiring</div>
            </div>
        </div>
        
        <!-- RASMLAR -->
        <div class="tab-content" id="tab-photos">
            <div class="photos-grid" id="photos-grid"></div>
            <div id="empty-photos" style="text-align:center; padding:60px 20px; color:var(--text-2); display:none;">
                <div style="font-size:48px;">🖼️</div>
                <div style="margin-top:12px;">Rasmlar yo'q</div>
                <div style="font-size:13px; margin-top:8px;">+ tugmasi orqali qo'shing</div>
            </div>
        </div>
        
        <!-- PROFIL -->
        <div class="tab-content" id="tab-profile">
            <div class="profile-section">
                <div class="profile-avatar" id="profile-avatar" onclick="changeProfilePhoto()">U</div>
                <div class="profile-name" id="profile-name">Foydalanuvchi</div>
                <div class="profile-username" id="profile-username">@username</div>
                
                <div class="profile-row" onclick="changeProfilePhoto()">
                    <span class="label">📷 Profil rasmi</span>
                    <span class="value">O'zgartirish</span>
                </div>
                <div class="profile-row" onclick="openSearch()">
                    <span class="label">🔍 Qidiruv</span>
                    <span class="value">Username</span>
                </div>
                <div class="profile-row" onclick="toggleTheme()">
                    <span class="label">🌓 Tungi rejim</span>
                    <span class="value" id="theme-value">Yo'q</span>
                </div>
                <div class="profile-row" onclick="logout()">
                    <span class="label">🚪 Chiqish</span>
                    <span class="value">→</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- PASTKI MENU -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="chats" onclick="switchTab('chats')">
            <span class="icon">💬</span>
            <span>Chatlar</span>
        </button>
        <button class="nav-btn" data-tab="photos" onclick="switchTab('photos')">
            <span class="icon">🖼️</span>
            <span>Rasmlar</span>
        </button>
        <button class="nav-btn" data-tab="profile" onclick="switchTab('profile')">
            <span class="icon">👤</span>
            <span>Profil</span>
        </button>
    </nav>
</div>

<!-- ==================== CHAT OYNASI ==================== -->
<div id="chat-window">
    <header class="chat-header">
        <button class="icon-btn" onclick="closeChat()">←</button>
        <div class="avatar" id="chat-avatar">U</div>
        <div class="chat-header-info">
            <div class="name" id="chat-name"></div>
            <div class="status" id="chat-status">oxirgi faollik yaqinda</div>
        </div>
        <button class="icon-btn" onclick="showChatMenu()">⋮</button>
    </header>
    <div id="messages"></div>
    <div class="typing" id="typing-indicator" style="display:none;">yozayapti...</div>
    <div class="chat-input">
        <button class="icon-btn" onclick="attachFile()">📎</button>
        <input type="text" id="message-input" placeholder="Xabar yozing..." 
               onkeypress="if(event.key==='Enter') sendMessage()"
               oninput="onTyping()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- ==================== QIDIRUV MODAL ==================== -->
<div id="search-modal" onclick="if(event.target===this) closeSearch()">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="@username yozing..." 
               autocomplete="off" onkeypress="if(event.key==='Enter') doSearch()">
        <div id="search-result"></div>
        <button style="width:100%; padding:12px; margin-top:8px; border:none; border-radius:10px; background:var(--bg-2); color:var(--text); cursor:pointer;" onclick="closeSearch()">Yopish</button>
    </div>
</div>

<!-- ==================== YASHIRIN FILE INPUT ==================== -->
<input type="file" id="file-input" accept="image/*" style="display:none">
<input type="file" id="profile-photo-input" accept="image/*" style="display:none">

<!-- ==================== TOAST ==================== -->
<div id="toast"></div>

<script>
// ==================== KONFIGURATSIYA ====================
const API_URL = window.location.origin;  // Ngrok URL avtomatik
let TOKEN = localStorage.getItem('token');
let CURRENT_CHAT = null;
let WS = null;
let USER = null;
let CHATS = [];
let PAROL = null;

// ==================== KALKULYATOR ====================
let calcIfoda = '';
let calcNatija = '0';
let oxirgiTeng = false;

function updateCalcDisplay() {
    document.getElementById('calc-ifoda').textContent = calcIfoda;
    document.getElementById('calc-natija').textContent = calcNatija;
}

function calcNum(n) {
    if (oxirgiTeng) {
        calcIfoda = '';
        oxirgiTeng = false;
    }
    calcIfoda += n;
    calcNatija = calcIfoda;
    updateCalcDisplay();
}

function calcOp(op) {
    if (oxirgiTeng) oxirgiTeng = false;
    // Oxirgi belgi operator bo'lsa, almashtirish
    const ops = ['+', '-', '*', '/', '%'];
    if (ops.includes(calcIfoda.slice(-1))) {
        calcIfoda = calcIfoda.slice(0, -1);
    }
    calcIfoda += op;
    calcNatija = calcIfoda;
    updateCalcDisplay();
}

function calcClear() {
    calcIfoda = '';
    calcNatija = '0';
    oxirgiTeng = false;
    updateCalcDisplay();
}

function calcBack() {
    calcIfoda = calcIfoda.slice(0, -1);
    calcNatija = calcIfoda || '0';
    updateCalcDisplay();
}

function calcEqual() {
    if (!calcIfoda) return;
    
    // Foizni almashtirish
    let ifoda = calcIfoda.replace(/%/g, '/100');
    
    try {
        // Xavfsiz hisoblash (eval emas, Function)
        // Faqat raqamlar va operatorlar
        if (!/^[0-9+\-*/().\s]+$/.test(ifoda)) {
            throw new Error('Xato');
        }
        
        const natija = Function('"use strict"; return (' + ifoda + ')')();
        
        if (!isFinite(natija)) throw new Error('Xato');
        
        calcNatija = String(natija);
        oxirgiTeng = true;
        updateCalcDisplay();
        
        // ⚡ Parol tekshirish uchun modal ochish
        setTimeout(() => {
            showVerifyModal(calcIfoda, calcNatija);
        }, 300);
        
    } catch (e) {
        calcNatija = 'Xato';
        updateCalcDisplay();
        setTimeout(() => {
            calcIfoda = '';
            calcNatija = '0';
            updateCalcDisplay();
        }, 800);
    }
}

// ==================== PAROL MODAL ====================
function showVerifyModal(misol, natija) {
    document.getElementById('verify-misol').textContent = `${misol} = ?`;
    document.getElementById('verify-input').value = '';
    document.getElementById('verify-modal').classList.add('active');
    
    // Saqlash
    window._verifyMisol = misol;
    window._verifyNatija = natija;
    
    setTimeout(() => document.getElementById('verify-input').focus(), 100);
}

function verifyCancel() {
    document.getElementById('verify-modal').classList.remove('active');
}

async function verifySubmit() {
    const javob = document.getElementById('verify-input').value.trim();
    if (!javob) return;
    
    try {
        const res = await fetch(API_URL + '/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                misol: window._verifyMisol,
                javob: javob
            })
        });
        
        const data = await res.json();
        
        if (data.success) {
            TOKEN = data.token;
            localStorage.setItem('token', TOKEN);
            localStorage.setItem('chat_id', data.chat_id);
            
            document.getElementById('verify-modal').classList.remove('active');
            await openApp();
        } else {
            toast(data.xato || 'Xato');
            document.getElementById('verify-input').value = '';
        }
    } catch (e) {
        toast('Server xatosi');
    }
}

// ==================== APP OCHISH ====================
async function openApp() {
    // Profilni yuklash
    const res = await apiFetch('/api/profile');
    if (!res) return;
    
    USER = res;
    
    // Header
    document.getElementById('header-name').textContent = 
        `${res.ism || ''} ${res.familya || ''}`.trim() || 'Foydalanuvchi';
    document.getElementById('profile-name').textContent = 
        `${res.ism || ''} ${res.familya || ''}`.trim();
    document.getElementById('profile-username').textContent = 
        '@' + (res.username || 'yoq');
    
    // Avatar
    updateAvatar('header-avatar', res.profil_rasm, res.ism);
    updateAvatar('profile-avatar', res.profil_rasm, res.ism);
    
    // Tungi rejim
    if (res.tungi_rejim) {
        document.body.classList.add('dark');
        document.getElementById('theme-btn').textContent = '☀️';
        document.getElementById('theme-value').textContent = 'Ha';
    }
    
    // Chatlar
    await loadChats();
    
    // Rasmlar
    await loadPhotos();
    
    // WebSocket
    connectWS();
    
    // Ko'rinishni almashtirish
    document.getElementById('calc-view').style.display = 'none';
    document.getElementById('app-view').classList.add('active');
}

function updateAvatar(id, url, ism) {
    const el = document.getElementById(id);
    if (url) {
        el.innerHTML = `<img src="${API_URL}${url}" alt="">`;
    } else {
        el.textContent = (ism || 'U')[0].toUpperCase();
    }
}

// ==================== API FETCH ====================
async function apiFetch(path, options = {}) {
    if (!TOKEN) return null;
    
    try {
        const res = await fetch(API_URL + path, {
            ...options,
            headers: {
                ...options.headers,
                'Authorization': 'Bearer ' + TOKEN,
                ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' })
            }
        });
        
        if (res.status === 401) {
            logout();
            return null;
        }
        
        return await res.json();
    } catch (e) {
        toast('Server xatosi');
        return null;
    }
}

// ==================== CHATLAR ====================
async function loadChats() {
    const res = await apiFetch('/api/chats');
    if (!res) return;
    
    CHATS = res.chats || [];
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    
    if (!CHATS.length) {
        document.getElementById('empty-chats').style.display = 'block';
        return;
    }
    document.getElementById('empty-chats').style.display = 'none';
    
    CHATS.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.onclick = () => openChat(chat);
        
        const avatar = chat.profil_rasm 
            ? `<img src="${API_URL}${chat.profil_rasm}">` 
            : (chat.ism || 'U')[0].toUpperCase();
        
        div.innerHTML = `
            <div class="avatar">${avatar}</div>
            <div class="chat-info">
                <div class="name">${chat.ism || ''} ${chat.familya || ''}</div>
                <div class="last ${chat.kurilgan ? '' : 'unread'}">
                    ${chat.oxirgi_xabar || 'Xabar yo\'q'}
                </div>
            </div>
        `;
        list.appendChild(div);
    });
}

// ==================== CHAT OCHISH ====================
async function openChat(chat) {
    CURRENT_CHAT = chat;
    
    document.getElementById('chat-name').textContent = 
        `${chat.ism || ''} ${chat.familya || ''}`;
    
    updateAvatar('chat-avatar', chat.profil_rasm, chat.ism);
    
    document.getElementById('chat-window').classList.add('active');
    
    await loadMessages();
    document.getElementById('message-input').focus();
}

async function loadMessages() {
    if (!CURRENT_CHAT) return;
    
    const res = await apiFetch(`/api/messages/${CURRENT_CHAT.chat_id}`);
    if (!res) return;
    
    const box = document.getElementById('messages');
    box.innerHTML = '';
    
    (res.messages || []).reverse().forEach(m => addMessageToDOM(m, false));
    
    box.scrollTop = box.scrollHeight;
}

function addMessageToDOM(m, scroll = true) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + (m.ozimniki ? 'out' : 'in');
    div.dataset.id = m.id;
    
    let content = '';
    
    if (m.xabar_turi === 'photo' && m.rasm_url) {
        content += `<img src="${API_URL}${m.rasm_url}">`;
    }
    
    if (m.matn) {
        content += escapeHtml(m.matn);
    }
    
    const vaqt = new Date(m.vaqt).toLocaleTimeString('uz', {hour:'2-digit', minute:'2-digit'});
    
    content += `<span class="vaqt">${vaqt}${m.tahrirlangan ? ' ✏️' : ''}</span>`;
    
    div.innerHTML = content;
    
    // O'chirish uchun (o'zimniki)
    if (m.ozimniki) {
        div.oncontextmenu = (e) => {
            e.preventDefault();
            if (confirm('O\'chirishni xohlaysizmi?')) {
                deleteMessage(m.id);
            }
        };
        div.ondblclick = () => {
            const yangi = prompt('Tahrirlash:', m.matn);
            if (yangi && yangi !== m.matn) {
                editMessage(m.id, yangi);
            }
        };
    }
    
    box.appendChild(div);
    if (scroll) box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function closeChat() {
    document.getElementById('chat-window').classList.remove('active');
    CURRENT_CHAT = null;
    loadChats();
}

// ==================== XABAR YUBORISH ====================
async function sendMessage() {
    const input = document.getElementById('message-input');
    const matn = input.value.trim();
    if (!matn || !CURRENT_CHAT) return;
    
    input.value = '';
    
    const res = await apiFetch('/api/messages/send', {
        method: 'POST',
        body: JSON.stringify({
            to_chat: CURRENT_CHAT.chat_id,
            matn: matn,
            xabar_turi: 'text'
        })
    });
    
    if (res && res.success) {
        addMessageToDOM({
            id: res.id,
            from_chat: USER.chat_id,
            to_chat: CURRENT_CHAT.chat_id,
            matn: matn,
            vaqt: new Date().toISOString(),
            ozimniki: true,
            xabar_turi: 'text'
        });
    }
}

async function deleteMessage(msgId) {
    const res = await apiFetch(`/api/messages/${msgId}`, { method: 'DELETE' });
    if (res && res.success) {
        const el = document.querySelector(`.message[data-id="${msgId}"]`);
        if (el) el.remove();
    }
}

async function editMessage(msgId, yangi) {
    const res = await apiFetch(`/api/messages/${msgId}`, {
        method: 'PUT',
        body: JSON.stringify({ msg_id: msgId, yangi_matn: yangi })
    });
    if (res && res.success) {
        loadMessages();
    }
}

// ==================== TYPING ====================
let typingTimer;
function onTyping() {
    if (!WS || !CURRENT_CHAT) return;
    WS.send(JSON.stringify({
        type: 'typing',
        to_chat: CURRENT_CHAT.chat_id
    }));
}

// ==================== RASMLAR ====================
async function loadPhotos() {
    const res = await apiFetch('/api/photos');
    if (!res) return;
    
    const grid = document.getElementById('photos-grid');
    grid.innerHTML = '';
    
    if (!res.photos || !res.photos.length) {
        document.getElementById('empty-photos').style.display = 'block';
        return;
    }
    document.getElementById('empty-photos').style.display = 'none';
    
    res.photos.forEach(p => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
            <img src="${API_URL}${p.url}">
            <button class="delete" onclick="event.stopPropagation(); deletePhoto(${p.id})">×</button>
        `;
        div.onclick = () => window.open(API_URL + p.url, '_blank');
        grid.appendChild(div);
    });
    
    // Yuklash tugmasi
    const addBtn = document.createElement('div');
    addBtn.className = 'photo-item';
    addBtn.style.display = 'flex';
    addBtn.style.alignItems = 'center';
    addBtn.style.justifyContent = 'center';
    addBtn.style.fontSize = '32px';
    addBtn.style.color = 'var(--primary)';
    addBtn.textContent = '+';
    addBtn.onclick = () => document.getElementById('file-input').click();
    grid.appendChild(addBtn);
}

async function deletePhoto(id) {
    if (!confirm('Rasmni o\'chirishni xohlaysizmi?')) return;
    
    const res = await apiFetch(`/api/photos/${id}`, { method: 'DELETE' });
    if (res && res.success) {
        loadPhotos();
        toast('Rasm o\'chirildi');
    }
}

}

// ==================== TUNGI REJIM ====================
async function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('theme-value').textContent = isDark ? 'Ha' : 'Yo\'q';
    localStorage.setItem('dark', isDark ? '1' : '0');
    
    await apiFetch('/api/profile/tungi-rejim', { method: 'POST' });
}

// ==================== TAB ALMASHTIRISH ====================
function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
    
    if (tab === 'photos') loadPhotos();
    if (tab === 'chats') loadChats();
}

// ==================== QIDIRUV ====================
function openSearch() {
    document.getElementById('search-modal').classList.add('active');
    setTimeout(() => document.getElementById('search-input').focus(), 100);
}

function closeSearch() {
    document.getElementById('search-modal').classList.remove('active');
    document.getElementById('search-input').value = '';
    document.getElementById('search-result').innerHTML = '';
}

async function doSearch() {
    const username = document.getElementById('search-input').value.trim();
    if (!username) return;
    
    const res = await apiFetch('/api/search', {
        method: 'POST',
        body: JSON.stringify({ username: username })
    });
    
    const box = document.getElementById('search-result');
    
    if (!res || !res.success) {
        box.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-2);">
            ❌ ${res?.xato || 'Topilmadi'}</div>`;
        return;
    }
    
    const u = res.user;
    const avatar = u.profil_rasm 
        ? `<img src="${API_URL}${u.profil_rasm}">` 
        : (u.ism || 'U')[0].toUpperCase();
    
    box.innerHTML = `
        <div class="search-result" onclick='startChat(${JSON.stringify(u)})'>
            <div class="avatar">${avatar}</div>
            <div>
                <div style="font-weight:600;">${u.ism} ${u.familya || ''}</div>
                <div style="color:var(--text-2); font-size:13px;">@${u.username}</div>
            </div>
        </div>
    `;
}

function startChat(u) {
    closeSearch();
    openChat({
        chat_id: u.chat_id,
        ism: u.ism,
        familya: u.familya,
        username: u.username,
        profil_rasm: u.profil_rasm
    });
}

// ==================== WEBSOCKET ====================
function connectWS() {
    if (!TOKEN) return;
    
    const wsUrl = API_URL.replace('https://', 'wss://').replace('http://', 'ws://');
    WS = new WebSocket(`${wsUrl}/ws/${TOKEN}`);
    
    WS.onmessage = (e) => {
        const data = JSON.parse(e.data);
        
        if (data.type === 'new_message') {
            if (CURRENT_CHAT && data.message.from_chat === CURRENT_CHAT.chat_id) {
                addMessageToDOM(data.message);
            } else {
                // Chat ro'yxatini yangilash
                loadChats();
            }
        }
        
        if (data.type === 'typing' && CURRENT_CHAT) {
            if (data.from_chat === CURRENT_CHAT.chat_id) {
                const ind = document.getElementById('typing-indicator');
                ind.style.display = 'block';
                clearTimeout(window._typingTO);
                window._typingTO = setTimeout(() => {
                    ind.style.display = 'none';
                }, 2000);
            }
        }
        
        if (data.type === 'message_deleted') {
            const el = document.querySelector(`.message[data-id="${data.msg_id}"]`);
            if (el) el.remove();
        }
        
        if (data.type === 'message_edited') {
            loadMessages();
        }
        
        if (data.type === 'read' && CURRENT_CHAT) {
            // O'qilgan belgisini yangilash (kelajakda)
        }
    };
    
    WS.onclose = () => {
        setTimeout(connectWS, 3000);
    };
    
    WS.onerror = () => {};
}

// ==================== FILE UPLOAD ====================
document.getElementById('file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const fd = new FormData();
    fd.append('file', file);
    fd.append('nom', file.name);
    
    try {
        const res = await fetch(API_URL + '/api/photos', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN },
            body: fd
        });
        const data = await res.json();
        
        if (data.success) {
            loadPhotos();
            toast('Rasm yuklandi');
        } else {
            toast(data.detail || 'Xato');
        }
    } catch (e) {
        toast('Yuklashda xato');
    }
    
    e.target.value = '';
});

document.getElementById('profile-photo-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const fd = new FormData();
    fd.append('file', file);
    
    try {
        const res = await fetch(API_URL + '/api/profile/photo', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN },
            body: fd
        });
        const data = await res.json();
        
        if (data.success) {
            updateAvatar('header-avatar', data.url, USER.ism);
            updateAvatar('profile-avatar', data.url, USER.ism);
            toast('Profil yangilandi');
        }
    } catch (e) {
        toast('Xato');
    }
    
    e.target.value = '';
});

    if (tanlov) {
        blockUser(CURRENT_CHAT.chat_id);

}

async function blockUser(chatId) {
    const res = await apiFetch(`/api/block/${chatId}`, { method: 'POST' });
    if (res && res.success) {
        toast('Bloklandi');
        closeChat();
    }
}

function attachFile() {

}

// ==================== LOGOUT ====================
async function logout() {
    if (!confirm('Chiqishni xohlaysizmi?')) return;
    
    await apiFetch('/api/auth/logout', { method: 'POST' });
    localStorage.removeItem('token');
    localStorage.removeItem('chat_id');
    TOKEN = null;
    USER = null;
    location.reload();
}

// ==================== TOAST ====================
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.remove('show'), 2500);
}

// ==================== 2-TAP DETEKTOR (ENG MUHIM!) ====================
let tapTimes = [];
let tapTimer = null;

document.addEventListener('touchend', (e) => {
    const now = Date.now();
    tapTimes.push(now);
    
    // 300ms ichidagi taplarni saqlash
    tapTimes = tapTimes.filter(t => now - t < 300);
    
    if (tapTimes.length >= 2) {
        tapTimes = [];
        
        // ⚡ 2-TAP ANIQLANDI!
        hideToCalculator();
    }
}, { passive: true });

// Kompyuter uchun (dblclick)
document.addEventListener('dblclick', (e) => {
    // Agar chat ochiq bo'lsa va matn tanlanmagan bo'lsa
    if (document.getElementById('chat-window').classList.contains('active')) {
        if (!window.getSelection().toString()) {
            hideToCalculator();
        }
    }
});

function hideToCalculator() {
    // Chat oynasini yashirish
    document.getElementById('chat-window').classList.remove('active');
    document.getElementById('verify-modal').classList.remove('active');
    document.getElementById('search-modal').classList.remove('active');
    
    // Asosiy appni yashirish
    document.getElementById('app-view').classList.remove('active');
    
    // Chat contentini tozalash (xavfsizlik)
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chat-list').innerHTML = '';
    document.getElementById('photos-grid').innerHTML = '';
    
    // Sessionni tozalash
    sessionStorage.clear();
    
    // Kalkulyatorni ko'rsatish
    document.getElementById('calc-view').style.display = 'flex';
    
    // Kalkulyatorni tozalash
    calcIfoda = '';
    calcNatija = '0';
    oxirgiTeng = false;
    updateCalcDisplay();
    
    // Token saqlanadi (keyingi kirishda kerak)
    // Lekin sahifa yangilanmaguncha chat ko'rinmaydi
    
    toast('🔒 Kalkulyator rejimi');
    
    // Xavfsizlik: 5 sekunddan keyin chatni butunlay unutish
    setTimeout(() => {
        CURRENT_CHAT = null;
        CHATS = [];
    }, 1000);
}

// Raqam klaviatura (kompyuter uchun)
document.addEventListener('keydown', (e) => {
    if (document.getElementById('calc-view').style.display === 'none') return;
    
    if (/[0-9]/.test(e.key)) calcNum(e.key);
    else if (['+', '-', '*', '/'].includes(e.key)) calcOp(e.key);
    else if (e.key === '=' || e.key === 'Enter') { e.preventDefault(); calcEqual(); }
    else if (e.key === 'Backspace') calcBack();
    else if (e.key === 'Escape') calcClear();
    else if (e.key === '%') calcOp('%');
    else if (e.key === '.') calcNum('.');
});
