<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Kalkulyator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b10;--bg-2:#0f0f16;--panel:#16161f;--panel-2:#1e1e2a;
  --text:#eef0f7;--text-2:#a8aab8;--muted:#7a7c8c;--line:#252534;
  --accent:#7c5cff;--accent-2:#5b8dff;
  --accent-grad:linear-gradient(135deg,#7c5cff 0%,#5b8dff 100%);
  --danger:#ff4d6d;--success:#22c55e;--warning:#f59e0b;
  --msg-me:linear-gradient(135deg,#7c5cff,#5b8dff);
  --msg-other:#22222e;
  --shadow:0 10px 40px rgba(0,0,0,.4);
  --radius:16px;--radius-lg:24px;
}
[data-theme="light"]{
  --bg:#f5f6fb;--bg-2:#eef0f7;--panel:#ffffff;--panel-2:#f0f2f9;
  --text:#0e0e15;--text-2:#4a4c5e;--muted:#818394;--line:#e2e5ef;
  --accent:#6a4bff;--accent-2:#2f6bff;
  --accent-grad:linear-gradient(135deg,#6a4bff 0%,#2f6bff 100%);
  --danger:#e62954;--msg-me:linear-gradient(135deg,#6a4bff,#2f6bff);
  --msg-other:#e8eaf2;--shadow:0 10px 40px rgba(60,60,120,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .3s,color .3s;
  user-select:none;-webkit-user-select:none;
}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
svg{display:block;flex-shrink:0}

/* ============ KALKULYATOR ============ */
#calcScreen{
  display:flex;flex-direction:column;height:100%;
  max-width:500px;width:100%;margin:0 auto;padding:16px;
  padding-top:max(16px,env(safe-area-inset-top));
  padding-bottom:max(16px,env(safe-area-inset-bottom));
}
.calc-display{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:flex-end;padding:20px 12px;min-height:120px;overflow:hidden;
}
#calcExpr{
  font-size:16px;color:var(--muted);min-height:22px;
  word-break:break-all;text-align:right;font-weight:400;
}
#calcResult{
  font-size:56px;font-weight:300;word-break:break-all;
  text-align:right;line-height:1.05;margin-top:10px;
  letter-spacing:-1.5px;
}
#calcResult.small{font-size:36px}
#calcResult.tiny{font-size:26px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:8px}
.key{
  aspect-ratio:1/1;border:none;border-radius:50%;
  font-size:26px;font-weight:500;cursor:pointer;
  background:var(--panel-2);color:var(--text);
  transition:transform .1s,background .2s;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;
}
.key:active{transform:scale(.9);background:var(--line)}
.key.op{background:var(--accent);color:#fff;font-weight:600}
.key.op:active{background:var(--accent-2)}
.key.fn{background:var(--panel);color:var(--accent);font-size:22px;font-weight:600}
.key.fn:active{background:var(--panel-2)}
.key.eq{
  background:var(--accent-grad);color:#fff;font-weight:700;
  box-shadow:0 4px 16px rgba(124,92,255,.35);
}
.key.eq:active{transform:scale(.9)}
.key.zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;justify-content:flex-start;padding-left:32px}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px;animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-box{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:28px 24px;
  width:100%;max-width:360px;text-align:center;
  box-shadow:var(--shadow);animation:slideUp .25s cubic-bezier(.2,1,.3,1);
}
.modal-title{
  font-size:14px;color:var(--muted);font-weight:600;
  margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.modal-example{
  font-size:38px;font-weight:600;letter-spacing:3px;
  color:var(--accent);margin-bottom:20px;
  font-variant-numeric:tabular-nums;
}
.modal-input{
  width:100%;padding:16px;font-size:24px;text-align:center;
  letter-spacing:6px;background:var(--panel-2);
  border:2px solid var(--line);border-radius:14px;
  color:var(--text);outline:none;font-weight:600;
  transition:border-color .2s;font-family:inherit;
}
.modal-input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;padding:14px;border-radius:14px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn-secondary{background:var(--panel-2);color:var(--text)}
.btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 16px rgba(124,92,255,.3)}
.btn-danger{background:var(--danger);color:#fff}

/* ============ ASOSIY APP ============ */
#mainApp{display:flex;flex-direction:column;height:100%;background:var(--bg-2)}
.top-bar{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:16px;
  overflow:hidden;flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.top-bar .who{flex:1;min-width:0}
.top-bar .who .name{
  font-size:16px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-bar .who .uname{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  border:none;background:var(--panel-2);color:var(--text);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .1s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.9);background:var(--line)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:0;display:none}
.view{padding:16px;min-height:100%}
.section-title{
  font-size:11px;color:var(--muted);padding:8px 4px 14px;
  font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
}
.chat-item{
  display:flex;align-items:center;gap:14px;padding:12px;
  border-radius:var(--radius);cursor:pointer;
  transition:background .15s;margin-bottom:4px;
}
.chat-item:active{background:var(--panel-2)}
.chat-item .avatar{width:52px;height:52px;font-size:20px}
.chat-item .info{flex:1;min-width:0}
.chat-item .info .name{
  font-size:15px;font-weight:600;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-item .info .last{
  font-size:13px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{margin:0 auto 16px;opacity:.4}
.empty-state p{font-size:14px;line-height:1.5}

/* ============ CHAT ============ */
#chatView{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:var(--bg-2);animation:slideIn .25s cubic-bezier(.2,1,.3,1);
}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.chat-header{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  padding-top:max(12px,env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
.chat-header .avatar{width:40px;height:40px;font-size:15px}
.chat-header .who{flex:1;min-width:0}
.chat-header .who .name{
  font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-header .who .uname{font-size:11px;color:var(--muted);margin-top:2px}
.messages{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:6px;
}
.messages::-webkit-scrollbar{width:0;display:none}
.msg{
  max-width:78%;padding:10px 14px;border-radius:18px;
  font-size:14.5px;line-height:1.45;word-wrap:break-word;
  position:relative;animation:msgIn .2s;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.me{
  align-self:flex-end;background:var(--msg-me);color:#fff;
  border-bottom-right-radius:6px;
}
.msg.other{
  align-self:flex-start;background:var(--msg-other);color:var(--text);
  border-bottom-left-radius:6px;
}
.msg img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.msg .meta{
  font-size:10.5px;opacity:.75;margin-top:4px;text-align:right;
}
.msg .edited{font-style:italic;font-size:10px;opacity:.75}
.msg-actions{
  position:absolute;top:-10px;right:0;display:flex;gap:4px;
  opacity:0;transition:opacity .2s;
}
.msg.me:hover .msg-actions,.msg.me:active .msg-actions{opacity:1}
.msg-actions button{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:11px;cursor:pointer;color:var(--text);
}
.input-bar{
  display:flex;gap:8px;padding:10px 12px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);flex-shrink:0;
}
.input-bar input[type=text]{
  flex:1;padding:12px 18px;border-radius:24px;
  border:1px solid var(--line);background:var(--panel-2);
  color:var(--text);font-size:15px;outline:none;font-family:inherit;
}
.input-bar input[type=text]:focus{border-color:var(--accent)}
.input-bar .send{
  width:46px;height:46px;border-radius:50%;border:none;flex-shrink:0;
  background:var(--accent-grad);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(124,92,255,.3);
}
.input-bar .send:active{transform:scale(.9)}

/* ============ GALLERY ============ */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery-grid .gitem{
  aspect-ratio:1/1;border-radius:12px;overflow:hidden;
  position:relative;background:var(--panel-2);cursor:pointer;
}
.gallery-grid .gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-grid .gitem .del{
  position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);
  color:#fff;border:none;border-radius:50%;width:26px;height:26px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);
}
.add-photo{
  aspect-ratio:1/1;border:2px dashed var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;background:var(--panel);
}
.add-photo:active{background:var(--panel-2)}

/* ============ PROFILE ============ */
.profile-card{
  background:var(--panel);border-radius:var(--radius-lg);
  padding:28px 20px;text-align:center;
  border:1px solid var(--line);margin-bottom:16px;
}
.profile-card .big-avatar{
  width:110px;height:110px;border-radius:50%;margin:0 auto 18px;
  overflow:hidden;background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:42px;
  position:relative;cursor:pointer;
  box-shadow:0 8px 24px rgba(124,92,255,.3);
}
.profile-card .big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-card .big-avatar .camera{
  position:absolute;bottom:2px;right:2px;
  background:var(--accent);width:34px;height:34px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--panel);
}
.profile-card h2{font-size:22px;margin-bottom:4px;font-weight:700}
.profile-card p{color:var(--muted);font-size:14px}
.profile-card .uid{
  color:var(--muted);font-size:12px;margin-top:10px;
  font-family:ui-monospace,monospace;background:var(--panel-2);
  display:inline-block;padding:4px 12px;border-radius:20px;
}
.field{
  background:var(--panel);border-radius:14px;padding:14px 16px;
  margin-bottom:10px;border:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.field label{flex:1;font-size:14px;color:var(--text-2);font-weight:500}
.field input{
  flex:1.5;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--text);
  font-size:14px;outline:none;font-family:inherit;
}
.field input:focus{border-color:var(--accent)}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.bottom-nav button{
  flex:1;padding:10px 4px 12px;background:none;border:none;
  color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;font-family:inherit;
}
.bottom-nav button.active{color:var(--accent)}

/* ============ SEARCH ============ */
#searchModal .modal-box{max-width:440px;text-align:left;padding:20px;align-self:flex-start;margin-top:80px}
#searchModal .modal-input{text-align:left;font-size:16px;letter-spacing:0;padding:14px 16px;font-weight:400}
.search-result{
  padding:12px;background:var(--panel-2);border-radius:12px;
  display:none;cursor:pointer;align-items:center;gap:12px;
  border:1px solid var(--line);margin-top:10px;
}
.search-result.show{display:flex}

/* ============ TOAST ============ */
#toast{
  position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:var(--panel);color:var(--text);
  padding:14px 22px;border-radius:14px;
  border:1px solid var(--line);font-size:14px;font-weight:500;
  z-index:1000;transition:transform .35s cubic-bezier(.2,1,.3,1);
  box-shadow:var(--shadow);max-width:88%;text-align:center;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--danger)}
#toast.success{border-color:var(--success)}

/* ============ BLOCKED ============ */
#blockedScreen{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
}
#blockedScreen svg{margin-bottom:24px;color:var(--warning)}
#blockedScreen h2{margin-bottom:10px;font-size:20px;font-weight:700}
#blockedScreen p{color:var(--muted);font-size:14px;max-width:280px}

/* ============ PHOTO VIEWER ============ */
#photoViewer{
  position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#photoViewer img{max-width:100%;max-height:100%;object-fit:contain}
#photoViewer .close{
  position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);
  color:#fff;border:none;width:44px;height:44px;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ KALKULYATOR ============ -->
  <div id="calcScreen">
    <div class="calc-display">
      <div id="calcExpr"></div>
      <div id="calcResult">0</div>
    </div>
    <div class="calc-keys">
      <button class="key fn" data-act="clear">AC</button>
      <button class="key fn" data-act="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
      <button class="key fn" data-act="percent">%</button>
      <button class="key op" data-op="/">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="*">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="-">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key zero" data-num="0">0</button>
      <button class="key" data-num=".">.</button>
      <button class="key eq" data-act="equals">=</button>
    </div>
  </div>

  <!-- ============ PAROL MODAL ============ -->
  <div id="pwdModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Xavfsizlik tekshiruvi
      </div>
      <div class="modal-example" id="pwdExample">12 + 12 =</div>
      <input class="modal-input" id="pwdInput" type="text" inputmode="numeric" placeholder="Javob.parol" autocomplete="off">
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closePwdModal()">Bekor</button>
        <button class="btn btn-primary" onclick="submitPwd()">Kirish</button>
      </div>
    </div>
  </div>

  <!-- ============ ASOSIY APP ============ -->
  <div id="mainApp" class="hidden">
    <div class="top-bar">
      <div class="avatar" id="myAvatar">?</div>
      <div class="who">
        <div class="name" id="myName">...</div>
        <div class="uname" id="myUsername">@...</div>
      </div>
      <button class="icon-btn" id="btnTheme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="btnSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <div class="content" id="content">
      <div class="view" id="view-chats">
        <div class="section-title">Suhbatlar</div>
        <div id="chatList"></div>
      </div>

      <div class="view hidden" id="view-gallery">
        <div class="section-title">Rasmlarim</div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <input type="file" id="galleryInput" accept="image/*" style="display:none">
      </div>

      <div class="view hidden" id="view-profile">
        <div class="profile-card">
          <div class="big-avatar" id="profAvatar" onclick="document.getElementById('profPhotoInput').click()">
            <span id="profAvatarText">?</span>
            <div class="camera">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
          </div>
          <h2 id="profName">...</h2>
          <p id="profUsername">@...</p>
          <div class="uid" id="profId">ID: ...</div>
        </div>
        <div class="field">
          <label>Ism-familiya</label>
          <input type="text" id="editName" placeholder="Ismingiz">
        </div>
        <div class="field">
          <label>Eski parol</label>
          <input type="text" id="oldPwd" placeholder="•••••" maxlength="5" inputmode="numeric">
        </div>
        <div class="field">
          <label>Yangi parol</label>
          <input type="text" id="newPwd" placeholder="5 xonali" maxlength="5" inputmode="numeric">
        </div>

<script>
/* ============================================================
   GLOBAL
   ============================================================ */
const API = '';
const tg = window.Telegram?.WebApp;
let currentUser = null;
let currentChat = null;
let ws = null;
let calcExpr = '';        // ekrandagi ifoda (faqat raqam va operatorlar)
let lightTheme = false;
let activeView = 'chats';
let tapCount = 0, tapTimer = null;
let pwdModalData = null;  // {a, b, answer}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.classList.remove('show'); t.className=''; }, 2400);
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', lightTheme?'light':'dark');
  const btn = document.getElementById('btnTheme');
  btn.innerHTML = lightTheme
    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`
    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  localStorage.setItem('theme', lightTheme?'light':'dark');
}
document.getElementById('btnTheme').onclick = ()=>{ lightTheme=!lightTheme; applyTheme(); };
lightTheme = localStorage.getItem('theme') === 'light';
applyTheme();

/* ============================================================
   ✅ KALKULYATOR — MUKAMMAL MANTIQ
   ============================================================ */
const exprEl = document.getElementById('calcExpr');
const resEl  = document.getElementById('calcResult');

// Ekranni yangilash
function updateCalc(){
  exprEl.textContent = calcExpr || '';

  // Agar ifoda bo'sh bo'lsa — 0
  if(!calcExpr){
    resEl.textContent = '0';
    resEl.classList.remove('small','tiny');
    return;
  }

  // Oxirgi belgi operator yoki nuqta bo'lsa — ifodani ko'rsatamiz
  const lastChar = calcExpr.slice(-1);
  if('+-*/%'.includes(lastChar) || calcExpr === '.'){
    resEl.textContent = calcExpr;
    return;
  }

  // Hisoblashga urinish
  try{
    const val = safeEval(calcExpr);
    if(val !== null && isFinite(val)){
      const s = formatNumber(val);
      resEl.textContent = s;
      resEl.classList.remove('small','tiny');
      if(s.length > 10) resEl.classList.add('small');
      if(s.length > 14) resEl.classList.add('tiny');
    } else {
      resEl.textContent = calcExpr;
    }
  }catch(e){
    resEl.textContent = calcExpr;
  }
}

// Xavfsiz eval — faqat raqam va operatorlar
function safeEval(expr){
  // % ni /100 ga aylantirish
  const clean = expr.replace(/%/g, '/100');
  // Faqat ruxsat etilgan belgilar
  if(!/^[\d+\-*/().\s]+$/.test(clean)) return null;
  try{
    return Function('"use strict";return (' + clean + ')')();
  }catch(e){ return null; }
}

// Chiroyli formatlash
function formatNumber(n){
  if(Number.isInteger(n)) return String(n);
  return String(Number(n.toFixed(10)));
}

// Klaviatura bosish
document.querySelectorAll('.key').forEach(btn=>{
  btn.onclick = ()=>{
    const num = btn.dataset.num;
    const op  = btn.dataset.op;
    const act = btn.dataset.act;

    if(num !== undefined){
      // Nuqta: faqat bitta bo'lishi mumkin oxirgi raqamda
      if(num === '.'){
        // Oxirgi raqamda nuqta bormi?
        const lastNum = calcExpr.split(/[+\-*/%()]/).pop();
        if(lastNum.includes('.')) return;
        if(calcExpr === '' || /[+\-*/%]$/.test(calcExpr)) calcExpr += '0.';
        else calcExpr += '.';
      } else {
        // 0 bilan boshlanmasin
        if(calcExpr === '0') calcExpr = num;
        else calcExpr += num;
      }
    }
    else if(op !== undefined){
      // Ketma-ket operatorlar bo'lmasin
      if(calcExpr === '' && op !== '-') return;
      const lastChar = calcExpr.slice(-1);
      if('+-*/%'.includes(lastChar)){
        // Operatorni almashtirish
        calcExpr = calcExpr.slice(0,-1) + op;
      } else {
        calcExpr += op;
      }
    }
    else if(act === 'clear'){ calcExpr = ''; }
    else if(act === 'back'){ calcExpr = calcExpr.slice(0,-1); }
    else if(act === 'percent'){
      // % ni oxiriga qo'shish
      if(calcExpr && !'+-*/%'.includes(calcExpr.slice(-1))) calcExpr += '%';
    }
    else if(act === 'equals'){ onEquals(); return; }

    updateCalc();
  };
});

/* ============================================================
   ✅ "=" BOSILGANDA — ENG MUHIM QISM
   ============================================================ */
function onEquals(){
  const text = (calcExpr || '').trim();
  if(!text){
    openPwdModal();
    return;
  }

  // 1) Format: "javob.parol" (masalan: 24.11100)
  //    Bunda ekranda "24.11100" bo'ladi
  if(text.includes('.')){
    const parts = text.split('.');
    if(parts.length === 2){
      const answerPart = parts[0];       // "24"
      const pwdPart = parts[1];          // "11100"

      // Ikkalasi ham to'g'ri bo'lsa
      if(answerPart === '24' && /^\d{5}$/.test(pwdPart)){
        tryLogin(pwdPart);
        return;
      }
      // Agar javob to'g'ri "24" bo'lsa-yu, parol 5 xonali bo'lmasa
      if(answerPart === '24' && pwdPart.length > 0 && pwdPart.length < 5){
        toast('Parol 5 xonali bo\'lishi kerak', 'error');
        return;
      }
    }
  }

  // 2) Faqat "24" yozilgan (javob)
  if(text === '24'){
    openPwdModal();
    return;
  }

  // 3) Oddiy hisoblash
  try{
    const val = safeEval(text);
    if(val !== null && isFinite(val)){
      calcExpr = formatNumber(val);
      updateCalc();
    }
  }catch(e){
    toast('Xato ifoda', 'error');
  }
}

/* ============================================================
   PAROL MODAL
   ============================================================ */
function openPwdModal(){
  // Qat'iy 12+12
  pwdModalData = { a: 12, b: 12, answer: '24' };
  document.getElementById('pwdExample').textContent = '12 + 12 =';
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('pwdInput').focus(), 200);
}
function closePwdModal(){
  document.getElementById('pwdModal').classList.add('hidden');
  pwdModalData = null;
}

async function submitPwd(){
  const input = document.getElementById('pwdInput').value.trim();
  if(!input){ toast('Javob kiriting', 'error'); return; }

  // 1) Format: "javob.parol" (masalan: 24.11100)
  if(input.includes('.')){
    const [ans, pwd] = input.split('.');
    if(ans !== '24'){
      toast('Javob xato! (12+12=24)', 'error');
      return;
    }
    if(!/^\d{5}$/.test(pwd)){
      toast('Parol 5 xonali bo\'lishi kerak', 'error');
      return;
    }
    await tryLogin(pwd);
    return;
  }

  // 2) Faqat "24" — oddiy javob (login qilmaymiz)
  if(input === '24'){
    toast('Endi parolni ham kiriting: 24.PAROL', 'info');
    return;
  }

  // 3) Faqat 5 xonali parol (agar javobsiz kiritsa)
  if(/^\d{5}$/.test(input)){
    // Javobni tekshirmasdan parolni sinab ko'ramiz
    await tryLogin(input);
    return;
  }

  toast('Format: 24.11100', 'error');
}

/* ============================================================
   LOGIN
   ============================================================ */
async function tryLogin(password){
  try{
    const r = await fetch(`${API}/api/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    if(!r.ok){
      const err = await r.json().catch(()=>({detail:'Xato'}));
      toast(err.detail || 'Parol xato', 'error');
      closePwdModal();
      calcExpr = '';
      updateCalc();
      return;
    }
    const data = await r.json();
    currentUser = data;
    localStorage.setItem('uid', data.user_id);
    localStorage.setItem('pwd', password);
    closePwdModal();
    calcExpr = '';
    updateCalc();
    showMainApp();
    toast('Xush kelibsiz!', 'success');
  }catch(e){
    toast('Server xatosi', 'error');
  }
}

/* ============================================================
   APP KO'RSATISH
   ============================================================ */
function showMainApp(){
  document.getElementById('calcScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  fillMyInfo();
  fillProfile();
  loadChats();
  connectWS();
}

function fillMyInfo(){
  if(!currentUser) return;
  document.getElementById('myName').textContent = currentUser.full_name || 'Foydalanuvchi';
  document.getElementById('myUsername').textContent = currentUser.username ? '@'+currentUser.username : '';
  const av = document.getElementById('myAvatar');
  if(currentUser.photo){
    av.innerHTML = `<img src="${currentUser.photo}" alt="">`;
  } else {
    av.textContent = (currentUser.full_name||'?').charAt(0).toUpperCase();
  }
}

function fillProfile(){
  if(!currentUser) return;
  document.getElementById('profName').textContent = currentUser.full_name || '...';
  document.getElementById('profUsername').textContent = currentUser.username ? '@'+currentUser.username : '';
  document.getElementById('profId').textContent = 'ID: ' + currentUser.user_id;
  document.getElementById('editName').value = currentUser.full_name || '';
  const pav = document.getElementById('profAvatar');
  const ptxt = document.getElementById('profAvatarText');
  if(currentUser.photo){
    pav.style.background = `url(${currentUser.photo}) center/cover`;
    ptxt.style.display = 'none';
  } else {
    pav.style.background = '';
    ptxt.style.display = 'block';
    ptxt.textContent = (currentUser.full_name||'?').charAt(0).toUpperCase();
  }
}

/* ============================================================
   NAVIGATSIYA
   ============================================================ */
document.querySelectorAll('.bottom-nav button').forEach(b=>{
  b.onclick = ()=>{
    const v = b.dataset.view;
    activeView = v;
    document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.toggle('active', x===b));
    ['chats','gallery','profile'].forEach(name=>{
      document.getElementById('view-'+name).classList.toggle('hidden', name!==v);
    });
    if(v === 'gallery') loadGallery();
    if(v === 'profile') fillProfile();
  };
});

/* ============================================================
   CHATLAR
   ============================================================ */
async function loadChats(){
  if(!currentUser) return;
  try{
    const r = await fetch(`${API}/api/chats/${currentUser.user_id}`);
    if(r.status === 423){ showBlocked(); return; }
    if(!r.ok) return;
    const chats = await r.json();
    const list = document.getElementById('chatList');
    if(chats.length === 0){
      list.innerHTML = `
        <div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p>Hali chatlar yo'q<br>Qidiruv orqali foydalanuvchi toping</p>
        </div>`;
      return;
    }
    list.innerHTML = chats.map(c => `
      <div class="chat-item" data-chat='${JSON.stringify(c).replace(/'/g,"&#39;")}'>
        <div class="avatar">${c.photo ? `<img src="${c.photo}" alt="">` : (c.full_name||'?').charAt(0).toUpperCase()}</div>
        <div class="info">
          <div class="name">${escapeHtml(c.full_name)}</div>
          <div class="last">${escapeHtml(c.last_message||'')}</div>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.chat-item').forEach(el=>{
      el.onclick = ()=>{
        try{ openChat(JSON.parse(el.dataset.chat.replace(/&#39;/g,"'"))); }
        catch(e){ console.error(e); }
      };
    });
  }catch(e){ console.error(e); }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   CHAT OCHISH
   ============================================================ */
async function openChat(peer){
  currentChat = peer;
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('chatName').textContent = peer.full_name;
  document.getElementById('chatUsername').textContent = peer.username ? '@'+peer.username : '';
  const av = document.getElementById('chatAvatar');
  if(peer.photo) av.innerHTML = `<img src="${peer.photo}" alt="">`;
  else av.textContent = (peer.full_name||'?').charAt(0).toUpperCase();
  await loadMessages(peer.user_id);
}

function closeChat(){
  document.getElementById('chatView').classList.add('hidden');
  currentChat = null;
  loadChats();
}

async function loadMessages(peerId){
  if(!currentUser) return;
  try{
    const r = await fetch(`${API}/api/messages/${currentUser.user_id}/${peerId}`);
    if(!r.ok) return;
    const msgs = await r.json();
    renderMessages(msgs);
  }catch(e){ console.error(e); }
}

function renderMessages(msgs){
  const box = document.getElementById('messages');
  if(msgs.length === 0){
    box.innerHTML = `<div class="empty-state" style="padding:40px 20px"><p>Xabarlar yo'q<br>Birinchi bo'lib yozing!</p></div>`;
    return;
  }
  box.innerHTML = msgs.map(m=>{
    const mine = m.from_id === currentUser.user_id;
    let content = '';
    if(m.type === 'image' && m.file_data){
      content = `<img src="${m.file_data}" alt="" onclick="openPhoto('${m.file_data}')">`;
      if(m.text) content += `<div>${escapeHtml(m.text)}</div>`;
    } else {
      content = escapeHtml(m.text || '');
    }
    const time = new Date(m.created_at).toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'});
    const editMark = m.edited ? ' <span class="edited">tahrirlangan</span>' : '';
    const actions = mine ? `
      <div class="msg-actions">
        <button onclick="editMsg(${m.id})" title="Tahrirlash">✎</button>
        <button onclick="deleteMsg(${m.id})" title="O'chirish">✕</button>
      </div>` : '';
    return `<div class="msg ${mine?'me':'other'}">
      ${actions}${content}
      <div class="meta">${time}${editMark}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ============================================================
   XABAR YUBORISH
   ============================================================ */
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentChat) return;
  input.value = '';
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({to: currentChat.user_id, text, type:'text'}));
  } else {
    try{
      await fetch(`${API}/api/messages`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({from_id: currentUser.user_id, to_id: currentChat.user_id, text, type:'text'})
      });
      await loadMessages(currentChat.user_id);
    }catch(e){ toast('Xabar yuborilmadi', 'error'); }
  }
}
document.getElementById('msgInput').addEventListener('keypress', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});

/* ============================================================
   TAHRIRLASH / O'CHIRISH
   ============================================================ */
async function editMsg(id){
  const nt = prompt('Yangi matn:');
  if(nt === null || nt.trim() === '') return;
  try{
    const r = await fetch(`${API}/api/messages/${id}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: nt, user_id: currentUser.user_id})
    });
    if(r.ok){ toast('Tahrirlandi', 'success'); await loadMessages(currentChat.user_id); }
  }catch(e){ toast('Xato', 'error'); }
}

async function deleteMsg(id){
  if(!confirm("O'chirishni tasdiqlaysizmi?")) return;
  try{
    const r = await fetch(`${API}/api/messages/${id}?user_id=${currentUser.user_id}`,{method:'DELETE'});
    if(r.ok){ toast("O'chirildi", 'success'); await loadMessages(currentChat.user_id); }
  }catch(e){ toast('Xato', 'error'); }
}

/* ============================================================
   RASM YUBORISH
   ============================================================ */
document.getElementById('chatFileInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file || !currentChat) return;
  try{
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
    const {url} = await r.json();
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({to: currentChat.user_id, text:'', type:'image', file_data: url}));
    } else {
      await fetch(`${API}/api/messages`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({from_id: currentUser.user_id, to_id: currentChat.user_id, text:'', type:'image', file_data: url})
      });
      await loadMessages(currentChat.user_id);
    }
  }catch(e){ toast('Rasm yuklanmadi', 'error'); }
  e.target.value = '';
};

/* ============================================================
   PHOTO VIEWER
   ============================================================ */
function openPhoto(url){
  document.getElementById('photoViewerImg').src = url;
  document.getElementById('photoViewer').classList.remove('hidden');
}

/* ============================================================
   WEBSOCKET
   ============================================================ */
function connectWS(){
  if(!currentUser) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try{
    ws = new WebSocket(`${proto}//${location.host}/ws/${currentUser.user_id}`);
    ws.onmessage = ev=>{
      try{
        const data = JSON.parse(ev.data);
        if(data.event === 'message'){
          const m = data.data;
          if(currentChat && (m.from_id === currentChat.user_id || m.to_id === currentChat.user_id)){
            loadMessages(currentChat.user_id);
          }
          if(activeView === 'chats') loadChats();
        }
      }catch(e){}
    };
    ws.onclose = ()=> setTimeout(connectWS, 3000);
  }catch(e){}
}

/* ============================================================
   QIDIRUV
   ============================================================ */
document.getElementById('btnSearch').onclick = ()=>{
  document.getElementById('searchModal').classList.remove('hidden');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResult').classList.remove('show');
  setTimeout(()=>document.getElementById('searchInput').focus(), 200);
};
function closeSearch(){ document.getElementById('searchModal').classList.add('hidden'); }

let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  const res = document.getElementById('searchResult');
  if(q.length < 2){ res.classList.remove('show'); return; }
  searchTimer = setTimeout(async()=>{
    try{
      const r = await fetch(`${API}/api/search`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username: q.replace('@','')})
      });
      if(!r.ok){ res.classList.remove('show'); return; }
      const u = await r.json();
      res.classList.add('show');
      res.innerHTML = `
        <div class="avatar" style="width:44px;height:44px;border-radius:50%;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;flex-shrink:0">
          ${u.profile_photo ? `<img src="${u.profile_photo}" style="width:100%;height:100%;object-fit:cover">` : (u.full_name||'?').charAt(0).toUpperCase()}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;margin-bottom:2px">${escapeHtml(u.full_name)}</div>
          <div style="font-size:12px;color:var(--muted)">@${escapeHtml(u.username)}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><polyline points="9 18 15 12 9 6"/></svg>
      `;
      res.onclick = ()=>{
        closeSearch();
        openChat({user_id: u.user_id, full_name: u.full_name, username: u.username, photo: u.profile_photo});
      };
    }catch(e){ res.classList.remove('show'); }
  }, 300);
});

/* ============================================================
   BLOKLASH
   ============================================================ */
async function blockUser(){
  if(!currentChat) return;
  if(!confirm(`@${currentChat.username || currentChat.full_name} bloklansinmi?`)) return;
  try{
    await fetch(`${API}/api/block`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, blocked_id: currentChat.user_id})
    });
    toast('Bloklandi', 'success');
    closeChat();
  }catch(e){ toast('Xato', 'error'); }
}

/* ============================================================
   GALEREYA
   ============================================================ */
async function loadGallery(){
  if(!currentUser) return;
  try{
    const r = await fetch(`${API}/api/gallery/${currentUser.user_id}`);
    if(!r.ok) return;
    const photos = await r.json();
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = photos.map(p => `
      <div class="gitem">
        <img src="${p.photo}" alt="" onclick="openPhoto('${p.photo}')">
        <button class="del" onclick="event.stopPropagation();delPhoto(${p.id})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    `).join('') + `
      <button class="add-photo" onclick="document.getElementById('galleryInput').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>`;
  }catch(e){}
}

document.getElementById('galleryInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
    const {url} = await r.json();
    const fd2 = new FormData();
    fd2.append('user_id', currentUser.user_id);
    fd2.append('photo', url);
    await fetch(`${API}/api/gallery/add`,{method:'POST',body:fd2});
    loadGallery();
    toast('Rasm qo\'shildi', 'success');
  }catch(e){ toast('Xato', 'error'); }
  e.target.value = '';
};

async function delPhoto(id){
  if(!confirm("O'chirilsinmi?")) return;
  try{
    await fetch(`${API}/api/gallery/${id}?user_id=${currentUser.user_id}`,{method:'DELETE'});
    loadGallery();
    toast("O'chirildi", 'success');
  }catch(e){ toast('Xato', 'error'); }
}

/* ============================================================
   PROFIL
   ============================================================ */
document.getElementById('profPhotoInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
    const {url} = await r.json();
    await fetch(`${API}/api/profile/update`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, photo: url})
    });
    currentUser.photo = url;
    fillProfile(); fillMyInfo();
    toast('Rasm saqlandi', 'success');
  }catch(e){ toast('Xato', 'error'); }
  e.target.value = '';
};

async function saveProfile(){
  const name = document.getElementById('editName').value.trim();
  const oldP = document.getElementById('oldPwd').value.trim();
  const newP = document.getElementById('newPwd').value.trim();
  let changed = false;

  if(name && name !== currentUser.full_name){
    await fetch(`${API}/api/profile/update`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, full_name: name})
    });
    currentUser.full_name = name;
    changed = true;
  }

  if(oldP || newP){
    if(!oldP || !newP){ toast('Ikkala parolni kiriting', 'error'); return; }
    const r = await fetch(`${API}/api/profile/password`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, old_password: oldP, new_password: newP})
    });
    if(!r.ok){ toast('Eski parol xato yoki yangi 5 xonali emas', 'error'); return; }
    localStorage.setItem('pwd', newP);
    document.getElementById('oldPwd').value = '';
    document.getElementById('newPwd').value = '';
    changed = true;
  }

  fillProfile(); fillMyInfo();
  toast(changed ? 'Saqlandi' : 'O\'zgarish yo\'q', changed ? 'success' : 'info');
}

function logout(){
  localStorage.removeItem('uid');
  localStorage.removeItem('pwd');
  currentUser = null;
  currentChat = null;
  if(ws){ try{ ws.close(); }catch(e){} ws = null; }
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('calcScreen').classList.remove('hidden');
  calcExpr = ''; updateCalc();
  toast('Chiqdingiz', 'info');
}

function showBlocked(){
  document.getElementById('blockedScreen').classList.remove('hidden');
}

/* ============================================================
   PANIC MODE — 2 marta tap
   ============================================================ */
document.addEventListener('touchstart', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(['input','textarea','select'].includes(tag)) return;
  tapCount++;
  if(tapCount === 1){ tapTimer = setTimeout(()=>{ tapCount = 0; }, 350); }
  if(tapCount >= 2){
    clearTimeout(tapTimer); tapCount = 0; panicMode();
  }
}, {passive:true});
document.addEventListener('dblclick', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(['input','textarea','select'].includes(tag)) return;
  panicMode();
});

function panicMode(){
  document.getElementById('pwdModal').classList.add('hidden');
  document.getElementById('searchModal').classList.add('hidden');
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('blockedScreen').classList.add('hidden');
  document.getElementById('photoViewer').classList.add('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('calcScreen').classList.remove('hidden');
  currentChat = null;
  calcExpr = '';
  updateCalc();
}

if(tg){

    tg.ready();
    tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#0b0b10');

/* ============================================================
   AUTO LOGIN
   ============================================================ */
(async function autoLogin(){
  const uid = localStorage.getItem('uid');
  const pwd = localStorage.getItem('pwd');
  if(!uid || !pwd){ updateCalc(); return; }
  try{
    const r = await fetch(`${API}/api/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd})
    });
    if(r.ok){
      currentUser = await r.json();
      showMainApp();
    } else {
      localStorage.removeItem('uid');
      localStorage.removeItem('pwd');
      updateCalc();
    }
  }catch(e){ updateCalc(); }
})();

updateCalc();
</script>
