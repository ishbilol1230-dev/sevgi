<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalkulyator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0f0f14; --panel:#17171f; --panel-2:#1f1f2b;
  --text:#eaeaf2; --muted:#8b8b9a; --line:#2a2a38;
  --accent:#7c5cff; --accent-2:#5b8dff; --danger:#ff4d6d;
  --msg-me:#7c5cff; --msg-other:#26263a;
}
[data-theme="light"]{
  --bg:#f4f5fa; --panel:#ffffff; --panel-2:#eef0f7;
  --text:#1a1a24; --muted:#666a80; --line:#dfe2ee;
  --accent:#6a4bff; --accent-2:#2f6bff; --danger:#e62954;
  --msg-me:#6a4bff; --msg-other:#e6e8f2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .25s,color .25s;
  user-select:none;
}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ============ KALKULYATOR ========= */
#calcScreen{
  display:flex;flex-direction:column;height:100%;
  max-width:480px;width:100%;margin:0 auto;padding:12px;
}
.calc-display{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:flex-end;padding:20px 10px;min-height:120px;overflow:hidden;
}
#calcExpr{font-size:16px;color:var(--muted);min-height:22px;word-break:break-all;text-align:right}
#calcResult{font-size:52px;font-weight:300;word-break:break-all;text-align:right;line-height:1.1;margin-top:8px}
.calc-keys{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:16px;
}
.key{
  aspect-ratio:1/1;border:none;border-radius:50%;
  font-size:24px;font-weight:500;cursor:pointer;
  background:var(--panel-2);color:var(--text);
  transition:transform .08s,background .2s;
  display:flex;align-items:center;justify-content:center;
}
.key:active{transform:scale(.92);background:var(--line)}
.key.op{background:var(--accent);color:#fff}
.key.op:active{background:var(--accent-2)}
.key.fn{background:var(--panel);color:var(--accent);font-size:20px}
.key.eq{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.key.zero{grid-column:span 2;aspect-ratio:auto;border-radius:40px}

/* ============ PAROL MODAL (kichik ekran) ============ */
#pwdModal{
  position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:50;
}
#pwdModal .box{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:28px 24px;width:88%;max-width:340px;text-align:center;
}
#pwdModal h3{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:14px}
#pwdExample{font-size:30px;font-weight:600;letter-spacing:2px;color:var(--accent);margin-bottom:18px}
#pwdInput{
  width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);outline:none;font-weight:600;
}
#pwdInput:focus{border-color:var(--accent)}
.pwd-btns{display:flex;gap:10px;margin-top:16px}
.pwd-btns button{
  flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;
  cursor:pointer;background:var(--panel-2);color:var(--text);
}
.pwd-btns button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}

/* ============ ASOSIY APP ============ */
#mainApp{display:flex;flex-direction:column;height:100%}

/* Header */
.top-bar{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;
}
.top-bar .avatar{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;
  overflow:hidden;flex-shrink:0;
}
.top-bar .avatar img{width:100%;height:100%;object-fit:cover}
.top-bar .who{flex:1;min-width:0}
.top-bar .who .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar .who .uname{font-size:12px;color:var(--muted)}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:var(--panel-2);
  color:var(--text);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
  transition:background .2s;flex-shrink:0;
}
.icon-btn:active{background:var(--line)}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.view{padding:12px;min-height:100%}
.section-title{font-size:13px;color:var(--muted);padding:6px 4px 10px;font-weight:600;text-transform:uppercase;letter-spacing:1px}

/* Chat list */
.chat-item{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;
  cursor:pointer;transition:background .15s;
}
.chat-item:active{background:var(--panel-2)}
.chat-item .avatar{
  width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden;flex-shrink:0;
}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover}
.chat-item .info{flex:1;min-width:0}
.chat-item .info .name{font-size:15px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .info .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat view */
#chatView{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.chat-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.chat-header .avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
}
.chat-header .avatar img{width:100%;height:100%;object-fit:cover}
.chat-header .who{flex:1;min-width:0}
.chat-header .who .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{
  max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;
  word-wrap:break-word;position:relative;animation:msgIn .18s ease-out;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--msg-me);color:#fff;border-bottom-right-radius:5px}
.msg.other{align-self:flex-start;background:var(--msg-other);color:var(--text);border-bottom-left-radius:5px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}
.msg .meta{font-size:10.5px;opacity:.7;margin-top:3px;text-align:right}
.msg .edited{font-style:italic;font-size:10px;opacity:.7}
.msg-actions{
  position:absolute;top:-8px;right:0;display:flex;gap:4px;opacity:0;transition:opacity .15s;
}
.msg.me:hover .msg-actions,.msg.me:active .msg-actions{opacity:1}
.msg-actions button{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:3px 7px;font-size:11px;cursor:pointer;color:var(--text);
}
.input-bar{
  display:flex;gap:8px;padding:10px 12px;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom));
}
.input-bar input[type=text]{
  flex:1;padding:11px 15px;border-radius:22px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:15px;outline:none;
}
.input-bar input[type=text]:focus{border-color:var(--accent)}
.input-bar .send{
  width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery-grid .gitem{
  aspect-ratio:1/1;border-radius:10px;overflow:hidden;position:relative;background:var(--panel-2);
}
.gallery-grid .gitem img{width:100%;height:100%;object-fit:cover}
.gallery-grid .gitem .del{
  position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;
  border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;
}
.add-photo{
  aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted);
  cursor:pointer;background:transparent;
}

/* Profile */
.profile-card{
  background:var(--panel);border-radius:20px;padding:24px;text-align:center;
  border:1px solid var(--line);margin-bottom:14px;
}
.profile-card .big-avatar{
  width:100px;height:100px;border-radius:50%;margin:0 auto 14px;overflow:hidden;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:36px;
  position:relative;cursor:pointer;
}
.profile-card .big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-card .big-avatar .camera{
  position:absolute;bottom:0;right:0;background:var(--accent);width:32px;height:32px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid var(--panel);
}
.profile-card h2{font-size:20px;margin-bottom:4px}
.profile-card p{color:var(--muted);font-size:14px}
.profile-card .uid{color:var(--muted);font-size:12px;margin-top:8px;font-family:monospace}
.field{
  background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  border:1px solid var(--line);display:flex;align-items:center;gap:12px;
}
.field label{flex:1;font-size:14px}
.field input{
  flex:2;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;color:var(--text);font-size:14px;outline:none;
}
.btn-primary{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;
}
.btn-primary:active{transform:scale(.98)}

/* Search modal */
#searchModal{
  position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;
}
#searchModal .box{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:20px;width:90%;max-width:400px;
}
#searchModal input{
  width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:15px;outline:none;margin-bottom:12px;
}
#searchResult{padding:10px;background:var(--panel-2);border-radius:12px;display:none;cursor:pointer}

/* Bottom nav */
.bottom-nav{
  display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
  flex:1;padding:12px 4px;background:none;border:none;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  font-size:10px;font-weight:500;transition:color .15s;
}
.bottom-nav button .ic{font-size:20px}
.bottom-nav button.active{color:var(--accent)}

/* Toast */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--panel);color:var(--text);padding:12px 22px;border-radius:12px;
  border:1px solid var(--line);font-size:14px;z-index:100;transition:transform .3s;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* Blocked screen */
#blockedScreen{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;
}
#blockedScreen .em{font-size:64px;margin-bottom:20px}
#blockedScreen h2{margin-bottom:10px}
#blockedScreen p{color:var(--muted);font-size:14px}

/* File input yashirin */
#fileInput{display:none}
</style>
</head>
<body>
<div id="app">

  <!-- ============ KALKULYATOR EKRANI ============ -->
  <div id="calcScreen">
    <div class="calc-display">
      <div id="calcExpr"></div>
      <div id="calcResult">0</div>
    </div>
    <div class="calc-keys">
      <button class="key fn" data-act="clear">AC</button>
      <button class="key fn" data-act="back">⌫</button>
      <button class="key fn" data-act="percent">%</button>
      <button class="key op" data-op="/">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="*">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="-">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key zero" data-num="0">0</button>
      <button class="key" data-num=".">.</button>
      <button class="key eq" data-act="equals">=</button>
    </div>
  </div>

  <!-- ============ PAROL MODAL ============ -->
  <div id="pwdModal" class="hidden">
    <div class="box">
      <h3>🛡 Xavfsizlik tekshiruvi</h3>
      <div id="pwdExample">14 + 12 =</div>
      <input id="pwdInput" type="text" inputmode="numeric" placeholder="Javob" autocomplete="off">
      <div class="pwd-btns">
        <button onclick="closePwdModal()">Bekor</button>
        <button class="primary" onclick="submitPwd()">Kirish</button>
      </div>
    </div>
  </div>

  <!-- ============ ASOSIY APP ============ -->
  <div id="mainApp" class="hidden">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="avatar" id="myAvatar">?</div>
      <div class="who">
        <div class="name" id="myName">...</div>
        <div class="uname" id="myUsername">@...</div>
      </div>
      <button class="icon-btn" id="btnTheme">🌙</button>
      <button class="icon-btn" id="btnSearch">🔍</button>
    </div>

    <!-- Content -->
    <div class="content" id="content">
      <!-- CHATLAR -->
      <div class="view" id="view-chats">
        <div class="section-title">💬 Suhbatlar</div>
        <div id="chatList"></div>
      </div>

      <!-- RASMLAR -->
      <div class="view hidden" id="view-gallery">
        <div class="section-title">🖼 Mening rasmlarim</div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <input type="file" id="galleryInput" accept="image/*" style="display:none">
      </div>

      <!-- PROFIL -->
      <div class="view hidden" id="view-profile">
        <div class="profile-card">
          <div class="big-avatar" id="profAvatar" onclick="document.getElementById('profPhotoInput').click()">
            <span id="profAvatarText">?</span>
            <div class="camera">📷</div>
          </div>
          <h2 id="profName">...</h2>
          <p id="profUsername">@...</p>
          <div class="uid" id="profId">ID: ...</div>
        </div>
        <div class="field">
          <label>Ism-familiya</label>
          <input type="text" id="editName" placeholder="Ismingiz">
        </div>
        <div class="field">
          <label>Eski parol</label>
          <input type="text" id="oldPwd" placeholder="•••••" maxlength="5">
        </div>
        <div class="field">
          <label>Yangi parol</label>
          <input type="text" id="newPwd" placeholder="5 xonali" maxlength="5">
        </div>
        <button class="btn-primary" onclick="saveProfile()">💾 Saqlash</button>
        <button class="btn-primary" style="background:var(--danger);margin-top:10px" onclick="logout()">🚪 Chiqish</button>
        <input type="file" id="profPhotoInput" accept="image/*" style="display:none">
      </div>
    </div>

    <!-- Bottom nav -->
    <div class="bottom-nav">
      <button data-view="chats" class="active"><span class="ic">💬</span>Asosiy</button>
      <button data-view="gallery"><span class="ic">🖼</span>Rasmlar</button>
      <button data-view="profile"><span class="ic">👤</span>Profil</button>
    </div>
  </div>

  <!-- ============ CHAT KO'RINISHI ============ -->
  <div id="chatView" class="hidden" style="position:absolute;inset:0;z-index:30">
    <div class="chat-header">
      <button class="icon-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="who">
        <div class="name" id="chatName">...</div>
        <div class="uname" id="chatUsername" style="font-size:11px;color:var(--muted)"></div>
      </div>
      <button class="icon-btn" onclick="blockUser()" title="Bloklash">🚫</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <button class="icon-btn" onclick="document.getElementById('chatFileInput').click()">📎</button>
      <input type="text" id="msgInput" placeholder="Xabar yozing..." autocomplete="off">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
    <input type="file" id="chatFileInput" accept="image/*" style="display:none">
  </div>

  <!-- ============ QIDIRUV ============ -->
  <div id="searchModal" class="hidden">
    <div class="box">
      <input type="text" id="searchInput" placeholder="@username kiriting..." autocomplete="off">
      <div id="searchResult"></div>
      <button class="btn-primary" style="background:var(--panel-2);color:var(--text);margin-top:12px" onclick="closeSearch()">Yopish</button>
    </div>
  </div>

  <!-- ============ BLOKLANGAN ============ -->
  <div id="blockedScreen" class="hidden">
    <div class="em">🔧</div>
    <h2>Hozir texnik muammolar</h2>
    <p>Iltimos, keyinroq qayta urinib ko'ring.</p>
  </div>

  <div id="toast"></div>
</div>

<script>
// ============ GLOBAL ============
const API = '';  // bir xil domenda
let tg = window.Telegram?.WebApp;
let currentUser = null;
let currentChat = null;
let ws = null;
let calcExpr = '';
let pwdModalData = null;
let lightTheme = false;
let activeView = 'chats';

// ============ TOAST ============
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ============ TEMA ============
function applyTheme(){
  document.documentElement.setAttribute('data-theme', lightTheme?'light':'dark');
  document.getElementById('btnTheme').textContent = lightTheme?'☀️':'🌙';
  localStorage.setItem('theme', lightTheme?'light':'dark');
}
document.getElementById('btnTheme').onclick = ()=>{
  lightTheme = !lightTheme; applyTheme();
};
if(localStorage.getItem('theme')==='light'){ lightTheme = true; applyTheme(); }
else applyTheme();

// ============ KALKULYATOR ============
const exprEl = document.getElementById('calcExpr');
const resEl  = document.getElementById('calcResult');

function updateCalc(){
  exprEl.textContent = calcExpr;
  // Live natija
  if(calcExpr.trim()===''){ resEl.textContent = '0'; return; }
  try{
    const safe = calcExpr.replace(/[^0-9+\-*/.()%]/g,'');
    if(!safe) { resEl.textContent = calcExpr; return; }
    let evalStr = safe.replace(/%/g,'/100');
    const val = Function('"use strict";return ('+evalStr+')')();
    if(val !== undefined && !isNaN(val)) resEl.textContent = String(Number(val.toFixed(10)));
    else resEl.textContent = calcExpr;
  }catch(e){ resEl.textContent = calcExpr; }
}

document.querySelectorAll('.key').forEach(btn=>{
  btn.onclick = ()=>{
    const num = btn.dataset.num, op = btn.dataset.op, act = btn.dataset.act;
    if(num !== undefined){
      if(calcExpr === '0' && num !== '.') calcExpr = num;
      else calcExpr += num;
    }
    else if(op !== undefined){ calcExpr += op; }
    else if(act === 'clear'){ calcExpr = ''; }
    else if(act === 'back'){ calcExpr = calcExpr.slice(0,-1); }
    else if(act === 'percent'){ calcExpr += '%'; }
    else if(act === 'equals'){ onEquals(); return; }
    updateCalc();
  };
});

function onEquals(){
  // Parol kiritilgan bo'lishi mumkin: "26.11100" yoki oddiy natija
  // Foydalanuvchi teng bosganida calcExpr ni tekshiramiz
  const text = (calcExpr || '').trim();
  if(!text){ return; }

  // 1) "javob.parol" formatida bo'lsa
  if(text.includes('.')){
    const parts = text.split('.');
    if(parts.length === 2){
      const pwd = parts[1].trim();
      if(pwd.length === 5 && /^\d{5}$/.test(pwd)){
        // Parolni tekshirish
        tryLogin(pwd);
        return;
      }
    }
  }

  // 2) Oddiy hisoblash
  try{
    let evalStr = text.replace(/%/g,'/100').replace(/[^0-9+\-*/.()\/]/g,'');
    const val = Function('"use strict";return ('+evalStr+')')();
    calcExpr = String(Number(val.toFixed(10)));
    updateCalc();
  }catch(e){
    toast('Xato ifoda');
  }
}

// ============ PAROL MODAL ============
function openPwdModal(){
  // Tasodifiy misol
  const a = 10 + Math.floor(Math.random()*20);
  const b = 5 + Math.floor(Math.random()*25);
  pwdModalData = { a, b, result: a+b };
  document.getElementById('pwdExample').textContent = `${a} + ${b} =`;
  document.getElementById('pwdInput').value = '';
  document.getElementById('pwdModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('pwdInput').focus(), 150);
}

function closePwdModal(){
  document.getElementById('pwdModal').classList.add('hidden');
}

async function submitPwd(){
  const input = document.getElementById('pwdInput').value.trim();
  if(!input){ toast('Javob kiriting'); return; }
  // Format: "26.11100" yoki "26" yoki "11100"
  let pwd = '';
  if(input.includes('.')){
    const p = input.split('.');
    pwd = p[1];
    // javobni tekshirish ixtiyoriy
  } else {
    // faqat parol bo'lishi mumkin
    if(input.length === 5){ pwd = input; }
    else {
      // faqat javob kiritilgan - chatlar ochilmaydi
      closePwdModal();
      // Kalkulyatorga qaytamiz
      return;
    }
  }
  if(pwd.length !== 5){ toast('Format: javob.parol'); return; }
  await tryLogin(pwd);
}

// ============ LOGIN ============
async function tryLogin(password){
  try{
    const r = await fetch(`${API}/api/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    if(!r.ok){
      const err = await r.json().catch(()=>({detail:'Xato'}));
      toast(err.detail || 'Parol xato');
      closePwdModal();
      return;
    }
    const data = await r.json();
    currentUser = data;
    localStorage.setItem('uid', data.user_id);
    localStorage.setItem('pwd', password);
    closePwdModal();
    showMainApp();
  }catch(e){
    toast('Server xatosi');
  }
}

// ============ APP KO'RSATISH ============
function showMainApp(){
  document.getElementById('calcScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  fillMyInfo();
  loadChats();
  loadGallery();
  fillProfile();
  connectWS();
}

function fillMyInfo(){
  if(!currentUser) return;
  document.getElementById('myName').textContent = currentUser.full_name || 'Foydalanuvchi';
  document.getElementById('myUsername').textContent = currentUser.username ? '@'+currentUser.username : '';
  const av = document.getElementById('myAvatar');
  if(currentUser.photo){
    av.innerHTML = `<img src="${currentUser.photo}">`;
  } else {
    av.textContent = (currentUser.full_name||'?').charAt(0).toUpperCase();
  }
}

function fillProfile(){
  if(!currentUser) return;
  document.getElementById('profName').textContent = currentUser.full_name || '...';
  document.getElementById('profUsername').textContent = currentUser.username ? '@'+currentUser.username : '';
  document.getElementById('profId').textContent = 'ID: '+currentUser.user_id;
  document.getElementById('editName').value = currentUser.full_name || '';
  const pav = document.getElementById('profAvatar');
  const ptxt = document.getElementById('profAvatarText');
  if(currentUser.photo){
    pav.style.background = `url(${currentUser.photo}) center/cover`;
    ptxt.style.display = 'none';
  } else {
    pav.style.background = '';
    ptxt.style.display = 'block';
    ptxt.textContent = (currentUser.full_name||'?').charAt(0).toUpperCase();
  }
}

// ============ NAVIGATSIYA ============
document.querySelectorAll('.bottom-nav button').forEach(b=>{
  b.onclick = ()=>{
    const v = b.dataset.view;
    activeView = v;
    document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.toggle('active', x===b));
    ['chats','gallery','profile'].forEach(name=>{
      document.getElementById('view-'+name).classList.toggle('hidden', name!==v);
    });
    if(v==='gallery') loadGallery();
    if(v==='profile') fillProfile();
  };
});

// ============ CHATLAR ============
async function loadChats(){
  try{
    const r = await fetch(`${API}/api/chats/${currentUser.user_id}`);
    if(r.status === 423){ showBlocked(); return; }
    if(!r.ok) return;
    const chats = await r.json();
    const list = document.getElementById('chatList');
    if(chats.length === 0){
      list.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px">
        <div style="font-size:48px;margin-bottom:10px">💬</div>
        Hali chatlar yo'q. Qidiruv orqali foydalanuvchi toping.
      </div>`;
      return;
    }
    list.innerHTML = chats.map(c=>`
      <div class="chat-item" onclick='openChat(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
        <div class="avatar">${c.photo ? `<img src="${c.photo}">` : (c.full_name||'?').charAt(0).toUpperCase()}</div>
        <div class="info">
          <div class="name">${escapeHtml(c.full_name)}</div>
          <div class="last">${escapeHtml(c.last_message||'')}</div>
        </div>
      </div>
    `).join('');
  }catch(e){ console.error(e); }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ============ CHAT OCHISH ============
async function openChat(peer){
  currentChat = peer;
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('chatName').textContent = peer.full_name;
  document.getElementById('chatUsername').textContent = peer.username ? '@'+peer.username : '';
  const av = document.getElementById('chatAvatar');
  if(peer.photo){ av.innerHTML = `<img src="${peer.photo}">`; }
  else { av.textContent = (peer.full_name||'?').charAt(0).toUpperCase(); }
  await loadMessages(peer.user_id);
}

function closeChat(){
  document.getElementById('chatView').classList.add('hidden');
  currentChat = null;
  loadChats();
}

async function loadMessages(peerId){
  const r = await fetch(`${API}/api/messages/${currentUser.user_id}/${peerId}`);
  if(!r.ok) return;
  const msgs = await r.json();
  renderMessages(msgs);
}

function renderMessages(msgs){
  const box = document.getElementById('messages');
  box.innerHTML = msgs.map(m=>{
    const mine = m.from_id === currentUser.user_id;
    let content = '';
    if(m.type === 'image' && m.file_data){
      content = `<img src="${m.file_data}">` + (m.text ? `<div>${escapeHtml(m.text)}</div>` : '');
    } else {
      content = escapeHtml(m.text || '');
    }
    const time = new Date(m.created_at).toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'});
    const editMark = m.edited ? ' <span class="edited">(tahrirlangan)</span>' : '';
    const actions = mine ? `<div class="msg-actions">
      <button onclick="editMsg(${m.id}, '${escapeAttr(m.text||'')}')">✏️</button>
      <button onclick="deleteMsg(${m.id})">🗑</button>
    </div>` : '';
    return `<div class="msg ${mine?'me':'other'}">
      ${actions}
      ${content}
      <div class="meta">${time}${editMark}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function escapeAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ============ XABAR YUBORISH ============
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentChat) return;
  input.value = '';
  // WebSocket orqali
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({to: currentChat.user_id, text, type:'text'}));
  } else {
    await fetch(`${API}/api/messages`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({from_id: currentUser.user_id, to_id: currentChat.user_id, text, type:'text'})
    });
    await loadMessages(currentChat.user_id);
  }
}

document.getElementById('msgInput').addEventListener('keypress', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});

// ============ XABARNI TAHRIRLASH / O'CHIRISH ============
async function editMsg(id, oldText){
  const nt = prompt('Yangi matn:', oldText);
  if(nt === null || nt.trim()==='') return;
  const fd = new FormData();
  fd.append('text', nt);
  fd.append('user_id', currentUser.user_id);
  await fetch(`${API}/api/messages/${id}`,{method:'PUT',body:fd});
  await loadMessages(currentChat.user_id);
}

async function deleteMsg(id){
  if(!confirm("O'chirishni tasdiqlaysizmi?")) return;
  await fetch(`${API}/api/messages/${id}?user_id=${currentUser.user_id}`,{method:'DELETE'});
  await loadMessages(currentChat.user_id);
}

// ============ RASM YUBORISH ============
document.getElementById('chatFileInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file || !currentChat) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
  const {url} = await r.json();
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({to: currentChat.user_id, text:'', type:'image', file_data:url}));
  } else {
    await fetch(`${API}/api/messages`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({from_id: currentUser.user_id, to_id: currentChat.user_id, text:'', type:'image', file_data:url})
    });
    await loadMessages(currentChat.user_id);
  }
  e.target.value = '';
};

// ============ WEBSOCKET ============
function connectWS(){
  if(!currentUser) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${currentUser.user_id}`);
  ws.onmessage = ev=>{
    const data = JSON.parse(ev.data);
    if(data.event === 'message'){
      const m = data.data;
      // Agar shu chat ochiq bo'lsa - qo'shamiz
      if(currentChat && (m.from_id === currentChat.user_id || m.to_id === currentChat.user_id)){
        loadMessages(currentChat.user_id);
      }
      // Chatlar ro'yxatini yangilash
      if(activeView === 'chats') loadChats();
    }
  };
  ws.onclose = ()=> setTimeout(connectWS, 3000);
}

// ============ QIDIRUV ============
document.getElementById('btnSearch').onclick = ()=>{
  document.getElementById('searchModal').classList.remove('hidden');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResult').style.display = 'none';
  setTimeout(()=>document.getElementById('searchInput').focus(), 150);
};
function closeSearch(){ document.getElementById('searchModal').classList.add('hidden'); }

document.getElementById('searchInput').addEventListener('input', async e=>{
  const q = e.target.value.trim();
  const res = document.getElementById('searchResult');
  if(q.length < 2){ res.style.display='none'; return; }
  try{
    const r = await fetch(`${API}/api/search`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: q.replace('@','')})
    });
    if(!r.ok){ res.style.display='none'; return; }
    const u = await r.json();
    res.style.display = 'block';
    res.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">
          ${u.photo?`<img src="${u.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:(u.full_name||'?').charAt(0)}
        </div>
        <div>
          <div style="font-weight:600">${escapeHtml(u.full_name)}</div>
          <div style="font-size:12px;color:var(--muted)">@${u.username}</div>
        </div>
      </div>`;
    res.onclick = ()=>{
      closeSearch();
      openChat(u);
    };
  }catch(e){ res.style.display='none'; }
});

// ============ BLOKLASH ============
async function blockUser(){
  if(!currentChat) return;
  if(!confirm(`@${currentChat.username} bloklansinmi?`)) return;
  await fetch(`${API}/api/block`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user_id: currentUser.user_id, blocked_id: currentChat.user_id})
  });
  toast('Bloklandi');
  closeChat();
}

// ============ GALEREYA ============
async function loadGallery(){
  if(!currentUser) return;
  const r = await fetch(`${API}/api/gallery/${currentUser.user_id}`);
  if(!r.ok) return;
  const photos = await r.json();
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = photos.map(p=>`
    <div class="gitem">
      <img src="${p.photo}">
      <button class="del" onclick="delPhoto(${p.id})">✕</button>
    </div>
  `).join('') + `<button class="add-photo" onclick="document.getElementById('galleryInput').click()">+</button>`;
}

document.getElementById('galleryInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
  const {url} = await r.json();
  const fd2 = new FormData();
  fd2.append('user_id', currentUser.user_id);
  fd2.append('photo', url);
  await fetch(`${API}/api/gallery/add`,{method:'POST',body:fd2});
  loadGallery();
  e.target.value = '';
};

async function delPhoto(id){
  if(!confirm("O'chirilsinmi?")) return;
  await fetch(`${API}/api/gallery/${id}?user_id=${currentUser.user_id}`,{method:'DELETE'});
  loadGallery();
}

// ============ PROFIL ============
document.getElementById('profPhotoInput').onchange = async e=>{
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(`${API}/api/upload`,{method:'POST',body:fd});
  const {url} = await r.json();
  await fetch(`${API}/api/profile/update`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user_id: currentUser.user_id, photo: url})
  });
  currentUser.photo = url;
  fillProfile(); fillMyInfo();
  toast('Rasm saqlandi');
  e.target.value = '';
};

async function saveProfile(){
  const name = document.getElementById('editName').value.trim();
  const oldP = document.getElementById('oldPwd').value.trim();
  const newP = document.getElementById('newPwd').value.trim();

  if(name && name !== currentUser.full_name){
    await fetch(`${API}/api/profile/update`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, full_name: name})
    });
    currentUser.full_name = name;
  }
  if(oldP || newP){
    if(!oldP || !newP){ toast('Ikkala parolni kiriting'); return; }
    const r = await fetch(`${API}/api/profile/password`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: currentUser.user_id, old_password: oldP, new_password: newP})
    });
    if(!r.ok){ toast('Eski parol xato yoki yangi parol 5 xonali emas'); return; }
    localStorage.setItem('pwd', newP);
    toast('Parol yangilandi');
  }
  fillProfile(); fillMyInfo();
  toast('Saqlandi');
}

function logout(){
  localStorage.removeItem('uid');
  localStorage.removeItem('pwd');
  currentUser = null;
  if(ws) ws.close();
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('calcScreen').classList.remove('hidden');
  calcExpr = ''; updateCalc();
}

// ============ BLOKLANGAN ============
function showBlocked(){
  document.getElementById('blockedScreen').classList.remove('hidden');
}

// ============ PANIC MODE - 2 marta tap ============
let tapCount = 0, tapTimer = null;
document.addEventListener('touchstart', e=>{
  // Input yoki button ichida bo'lsa, hisoblamaymiz
  const tag = e.target.tagName.toLowerCase();
  if(['input','textarea'].includes(tag)) return;
  tapCount++;
  if(tapCount === 1){
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 320);
  }
  if(tapCount >= 2){
    clearTimeout(tapTimer);
    tapCount = 0;
    panicMode();
  }
}, {passive:true});

// Mouse uchun ham (desktop test)
document.addEventListener('dblclick', e=>{
  const tag = e.target.tagName.toLowerCase();
  if(['input','textarea'].includes(tag)) return;
  panicMode();
});

function panicMode(){
  // Hamma modallarni yopish
  document.getElementById('pwdModal').classList.add('hidden');
  document.getElementById('searchModal').classList.add('hidden');
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('blockedScreen').classList.add('hidden');
  // Asosiy appni yashirish
  document.getElementById('mainApp').classList.add('hidden');
  // Kalkulyatorni ko'rsatish
  document.getElementById('calcScreen').classList.remove('hidden');
  // Chatni yopish
  currentChat = null;
  // Kalkulyatorni tozalash
  calcExpr = '';
  updateCalc();
}

// ============ TELEGRAM WEBAPP ============
if(tg){
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0f0f14');
}

// ============ AVTOMATIK KIRISH ============
(async function autoLogin(){
  const uid = localStorage.getItem('uid');
  const pwd = localStorage.getItem('pwd');
  if(!uid || !pwd){ updateCalc(); return; }
  try{
    const r = await fetch(`${API}/api/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd})
    });
    if(r.ok){
      currentUser = await r.json();
      showMainApp();
    } else {
      updateCalc();
    }
  }catch(e){ updateCalc(); }
})();

updateCalc();
